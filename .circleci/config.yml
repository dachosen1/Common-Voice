version: 2

defaults:
  docker:
    - image: circleci/python:3.7
  working_directory: ~/project

jobs:
  common-voice-api:
    docker:
      - image: circleci/python:3.7
    working_directory: ~/project
    steps:
      - checkout:
          path: ~/project

      - run:
          name: Test API
          command: |
            sudo apt-get install libsndfile1
            python -m venv venv
            source venv/bin/activate
            sudo pip install --upgrade pip
            sudo apt-get install portaudio19-dev python-pyaudio python3-pyaudio
            sudo pip install -r requirements.txt
            sudo pip install --no-cache-dir torch==1.6.0+cpu -f https://download.pytorch.org/whl/cpu/torch_stable.html
            sudo pytest
workflows:
  version: 2
  build-project:
    jobs:
      - common-voice-api
