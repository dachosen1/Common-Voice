version: 2

defaults:
  docker:
    - image: circleci/python:3.7
  working_directory: ~/project

jobs:
  pull-and-build:
    docker:
      - image: arvindr226/alpine-ssh
    working_directory: ~/Common-Voice
    steps:
      - checkout:
          path: ~/Common-Voice
      - run:
          name: Deploy 
          command: |
            ssh -oStrictHostKeyChecking=no -v $USER@$IP 

  common-voice-api:
    docker:
      - image: circleci/python:3.7
    working_directory: ~/project/commonvoice
    steps:
      - checkout:
          path: ~/project

      - run:
          name: Test API
          command: |
            python -m venv venv
            source venv/bin/activate
            sudo pip install --upgrade pip
            sudo apt-get install portaudio19-dev python-pyaudio python3-pyaudio
workflows:
  version: 2
  build-project:
    jobs:
      - common-voice-api
      - pull-and-build