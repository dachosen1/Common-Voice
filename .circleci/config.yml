version: 2

defaults:
  docker:
    - image: circleci/python:3.7
  working_directory: ~/project

jobs:
  common-voice-api:
    docker:
      - image: circleci/python:3.7
    working_directory: ~/project
    steps:
      - checkout:
          path: ~/project

      - run:
          name: Test Package
          command: |
            sudo apt-get install libsndfile1
            sudo apt-get install portaudio19-dev python-pyaudio python3-pyaudio
            python -m venv venv
            source venv/bin/activate
            pip install --upgrade pip

            pip install -r requirements.txt
            pip install --no-cache-dir torch==1.6.0+cpu -f https://download.pytorch.org/whl/cpu/torch_stable.html
            pytest
            
      - run:
        name: Setup testing environment
        command: |
          pip install '.[test]' --user
          echo $HOME
    - run:
        name: Run Tests
        command: |
          $HOME/.local/bin/coverage run -m pytest
          $HOME/.local/bin/coverage report
          $HOME/.local/bin/coverage html  # open htmlcov/index.html in a browser
    - store_artifacts:
        path: htmlcov
workflows:
  version: 2
  build-project:
    jobs:
      - common-voice-api
