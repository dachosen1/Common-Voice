name: Build & Deploy 
# on: 
#   push: 
#     branches: [master]

jobs: 
  deploy: 
    runs-on: unbutu-latest
    steps: 
    - name: Deploy Common Voice Application
      uses: appleboy/ssh-action@v0.1.2
      with: 
        host: ${{secrets.SSH_HOST}}
        key: ${{secrets.SSH_KEY}}
        username: ${{secrets.SSH_USERNAME}}
        
        script: | 
          cd Common-Voice
          git pull
          docker-compose up --build
        
        
        
        
